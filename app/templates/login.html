<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &bull; Smart Grocery Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon">🛒</div>
        <h2>Welcome Back</h2>
        <p>Sign in to manage your grocery inventory &amp; expiry alerts</p>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label">Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;" id="btnLogin">
          Sign In
        </button>

        <!-- Quick Demo Login Buttons for Evaluator / Portfolio Review -->
        <div style="background: var(--bg-surface-elevated); padding: 14px; border-radius: var(--radius-md); border: 1px dashed var(--border-subtle); margin-top: 16px;">
          <small style="display: block; text-align: center; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">
            Quick Demo Login:
          </small>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillDemoCredentials('admin', 'admin123')">
              👑 Admin Demo
            </button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillDemoCredentials('user', 'user123')">
              👤 User Demo
            </button>
          </div>
        </div>

        <div class="auth-footer">
          Don't have an account? <a href="/register">Create an account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    function fillDemoCredentials(u, p) {
      document.getElementById('loginUsername').value = u;
      document.getElementById('loginPassword').value = p;
      document.getElementById('loginForm').requestSubmit();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      const payload = {
        username: document.getElementById('loginUsername').value.trim(),
        password: document.getElementById('loginPassword').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Login failed. Please check credentials.');
        }

        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 500);

      } catch (err) {
        showToast(err.message, 'error');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }

    // Check for message in query string
    document.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      if (p.get('msg')) {
        showToast(decodeURIComponent(p.get('msg')), 'warning');
      }
    });
  </script>
</body>
</html>
