<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register &bull; Smart Grocery Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="brand-icon">🛒</div>
        <h2>Create Account</h2>
        <p>Start tracking groceries, expiry dates, and spending</p>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <div class="form-grid" style="margin-bottom: 16px;">
          <div class="form-group form-full">
            <label class="form-label">Full Name</label>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Samruddhi Patil" required>
          </div>

          <div class="form-group">
            <label class="form-label">Username *</label>
            <input type="text" id="regUsername" class="form-control" placeholder="username" required>
          </div>

          <div class="form-group">
            <label class="form-label">Account Role</label>
            <select id="regRole" class="form-control">
              <option value="user">User (Household)</option>
              <option value="admin">Admin (Store Manager)</option>
            </select>
          </div>

          <div class="form-group form-full">
            <label class="form-label">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group form-full">
            <label class="form-label">Password * (min 6 characters)</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Create a secure password" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;" id="btnRegister">
          Register &amp; Get Started
        </button>

        <div class="auth-footer">
          Already have an account? <a href="/login">Sign in here</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnRegister');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      const payload = {
        full_name: document.getElementById('regFullName').value.trim(),
        username: document.getElementById('regUsername').value.trim(),
        email: document.getElementById('regEmail').value.trim().toLowerCase(),
        role: document.getElementById('regRole').value,
        password: document.getElementById('regPassword').value
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Registration failed');
        }

        showToast('Registration successful! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = '/login?msg=Account+created+successfully!+Please+sign+in.';
        }, 800);

      } catch (err) {
        showToast(err.message, 'error');
        btn.textContent = 'Register & Get Started';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
