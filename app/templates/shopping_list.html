{% extends "base.html" %}

{% block content %}
<!-- Shopping List Toolbar -->
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn btn-secondary btn-sm" onclick="autoSyncShoppingList()">
      <span>🔄</span>
      <span>Auto-Sync Low Stock Items</span>
    </button>
    <button class="btn btn-secondary btn-sm" onclick="clearPurchased()">
      <span>🧹</span>
      <span>Clear Purchased</span>
    </button>
    <button class="btn btn-secondary btn-sm" onclick="copyShoppingListText()">
      <span>📋</span>
      <span>Copy for WhatsApp</span>
    </button>
  </div>

  <div class="toolbar-right">
    <div style="font-size: 0.9rem; font-weight: 700; color: var(--primary-500); margin-right: 12px;" id="estimatedBillTotal">
      Estimated Bill: ₹0.00
    </div>
    <button class="btn btn-primary btn-sm" onclick="openAddShoppingModal()">
      <span>➕</span>
      <span>Add Item</span>
    </button>
  </div>
</div>

<!-- Shopping List Card -->
<div class="card" style="padding: 0; overflow: hidden;">
  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th style="width: 50px;">Status</th>
          <th>Item Needed</th>
          <th>Category</th>
          <th>Target Quantity</th>
          <th>Est. Price (₹)</th>
          <th>Type</th>
          <th style="text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="shoppingTableBody">
        <tr>
          <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
            Loading shopping list items...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Shopping Item Modal -->
<div id="shoppingItemModal" class="modal-backdrop">
  <div class="modal-card" style="max-width: 460px;">
    <div class="modal-header">
      <h3>Add Item to Shopping List</h3>
      <button class="btn-close" onclick="closeModal('shoppingItemModal')">&times;</button>
    </div>
    <form id="shoppingItemForm" onsubmit="handleShoppingFormSubmit(event)">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group form-full">
            <label class="form-label">Item Name *</label>
            <input type="text" id="shopItemName" class="form-control" placeholder="e.g. Cooking Oil" required>
          </div>

          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="shopItemCategory" class="form-control">
              <option value="">General</option>
              {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Quantity Needed *</label>
            <input type="number" id="shopItemQuantity" class="form-control" step="0.1" min="0.1" value="1.0" required>
          </div>

          <div class="form-group">
            <label class="form-label">Unit *</label>
            <select id="shopItemUnit" class="form-control" required>
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="L">L</option>
              <option value="ml">ml</option>
              <option value="pcs">pcs</option>
              <option value="packets">packets</option>
              <option value="bottles">bottles</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Estimated Price (₹)</label>
            <input type="number" id="shopItemPrice" class="form-control" step="1" min="0" value="0.0">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('shoppingItemModal')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Add to List</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentShoppingItems = [];

async function loadShoppingList() {
  const tbody = document.getElementById('shoppingTableBody');
  try {
    const items = await apiRequest('/api/shopping-list');
    currentShoppingItems = items || [];
    renderShoppingTable(currentShoppingItems);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--status-critical); padding: 30px;">Error loading shopping list: ${err.message}</td></tr>`;
  }
}

function renderShoppingTable(items) {
  const tbody = document.getElementById('shoppingTableBody');
  tbody.innerHTML = '';

  let totalEstimatedBill = 0;

  if (!items || items.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-dim);">
          🛒 Your shopping list is empty! Click "Auto-Sync Low Stock Items" or add items manually.
        </td>
      </tr>
    `;
    document.getElementById('estimatedBillTotal').textContent = 'Estimated Bill: ₹0.00';
    return;
  }

  items.forEach(it => {
    if (!it.is_purchased) {
      totalEstimatedBill += (it.estimated_price || 0);
    }

    const tr = document.createElement('tr');
    tr.style.opacity = it.is_purchased ? '0.5' : '1';

    const checkIcon = it.is_purchased ? '✅' : '⏳';
    const tagBadge = it.auto_added ? '<span class="badge badge-warning">Auto Low-Stock</span>' : '<span class="badge badge-fresh">Manual</span>';

    tr.innerHTML = `
      <td style="text-align: center; font-size: 1.1rem;">${checkIcon}</td>
      <td>
        <strong style="${it.is_purchased ? 'text-decoration: line-through;' : ''}">${it.product_name}</strong>
      </td>
      <td>${it.category_name || 'General'}</td>
      <td><strong>${it.target_quantity} ${it.unit}</strong></td>
      <td>₹${it.estimated_price ? it.estimated_price.toFixed(2) : '0.00'}</td>
      <td>${tagBadge}</td>
      <td style="text-align: right; white-space: nowrap;">
        ${!it.is_purchased ? `
          <button class="btn btn-primary btn-sm" onclick="markShoppingPurchased(${it.id}, '${it.product_name}')">
            🛒 Mark Bought &amp; Restock
          </button>
        ` : '<span style="font-size: 0.8rem; color: var(--text-muted); margin-right: 8px;">Purchased</span>'}
        <button class="btn btn-outline-danger btn-sm" title="Remove" onclick="deleteShoppingItem(${it.id})">🗑️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('estimatedBillTotal').textContent = `Estimated Bill: ₹${totalEstimatedBill.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
}

function openAddShoppingModal() {
  document.getElementById('shoppingItemForm').reset();
  openModal('shoppingItemModal');
}

async function handleShoppingFormSubmit(e) {
  e.preventDefault();
  const payload = {
    product_name: document.getElementById('shopItemName').value.trim(),
    category_id: parseInt(document.getElementById('shopItemCategory').value) || null,
    target_quantity: parseFloat(document.getElementById('shopItemQuantity').value),
    unit: document.getElementById('shopItemUnit').value,
    estimated_price: parseFloat(document.getElementById('shopItemPrice').value) || 0.0
  };

  try {
    await apiRequest('/api/shopping-list', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    showToast(`Added "${payload.product_name}" to shopping list!`, 'success');
    closeModal('shoppingItemModal');
    loadShoppingList();
  } catch (err) {
    console.error('Add shopping item error:', err);
  }
}

async function deleteShoppingItem(itemId) {
  try {
    await apiRequest(`/api/shopping-list/${itemId}`, { method: 'DELETE' });
    showToast('Item removed from shopping list', 'info');
    loadShoppingList();
  } catch (err) {
    console.error('Delete shopping item error:', err);
  }
}

async function clearPurchased() {
  try {
    const res = await apiRequest('/api/shopping-list/clear/purchased', { method: 'DELETE' });
    showToast(res.message, 'success');
    loadShoppingList();
  } catch (err) {
    console.error('Clear error:', err);
  }
}

function copyShoppingListText() {
  const pending = currentShoppingItems.filter(i => !i.is_purchased);
  if (pending.length === 0) {
    showToast('No pending items to copy!', 'warning');
    return;
  }

  let text = "🛒 *Smart Grocery Shopping List*\n\n";
  pending.forEach((it, idx) => {
    text += `${idx + 1}. ${it.product_name} - ${it.target_quantity} ${it.unit} (Est: ₹${it.estimated_price})\n`;
  });

  const total = pending.reduce((sum, i) => sum + (i.estimated_price || 0), 0);
  text += `\n💰 *Estimated Total:* ₹${total.toFixed(2)}`;

  navigator.clipboard.writeText(text).then(() => {
    showToast('Shopping list copied to clipboard! Ready to paste into WhatsApp.', 'success');
  }).catch(() => {
    showToast('Failed to copy text', 'error');
  });
}

document.addEventListener('DOMContentLoaded', () => {
  loadShoppingList();
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('add_product')) {
    openAddShoppingModal();
  }
});
</script>
{% endblock %}
